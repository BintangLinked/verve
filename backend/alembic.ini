# Alembic configuration (database migrations). The database URL is taken from app/config.py
# (see migrations/env.py), so it is not written here.
[alembic]
script_location = migrations
# Adds the backend/ folder to sys.path so that migrations/env.py can import `app`
# when Alembic is run from the CLI (pytest uses pytest.ini for the same purpose).
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
